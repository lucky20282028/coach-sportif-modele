<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Coach</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0F1A33">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
/* ==========================================================================
   COACH v2 — thème clair et sombre.
   La barre d'état de l'iPhone reste en texte blanc (black-translucent) : le
   bandeau du haut est donc toujours foncé, même en thème clair. Le contenu,
   lui, suit le thème choisi dans les réglages.
   ========================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#FFFFFF; --s1:#F2F4F6; --s2:#E6E9ED; --line:#E3E6EA;
 --t1:#0D1014; --t2:#3F4752; --t3:#737C88; --t4:#A1A8B2;
 --ok:#15803D; --okbg:#DCFCE7; --ko:#C81E1E; --kobg:#FDE8E8; --warn:#A16207; --warnbg:#FEF3C7;
 --btn:#0D1014; --btnt:#FFFFFF;
 --ch:#0F1A33; --cht:#FFFFFF; --cht3:#93A0B8; --chs:#1C2A4A;
 --ac:#2563EB; --act:#FFFFFF;
 --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
 --cs:light;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#0A0F1C; --s1:#131A2A; --s2:#1A2336; --line:#1E2738;
  --t1:#FFFFFF; --t2:#B4BCC6; --t3:#6B7683; --t4:#4B5563;
  --ok:#4ADE80; --okbg:#0F2A1A; --ko:#F87171; --kobg:#2A1416; --warn:#FBBF24; --warnbg:#251D10;
  --btn:#FFFFFF; --btnt:#0A0C0F; --ch:#0A1226; --chs:#17223D; --ac:#4D8BFF;
  --cs:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#0A0F1C; --s1:#131A2A; --s2:#1A2336; --line:#1E2738;
 --t1:#FFFFFF; --t2:#B4BCC6; --t3:#6B7683; --t4:#4B5563;
 --ok:#4ADE80; --okbg:#0F2A1A; --ko:#F87171; --kobg:#2A1416; --warn:#FBBF24; --warnbg:#251D10;
 --btn:#FFFFFF; --btnt:#0A0C0F; --ch:#0A1226; --chs:#17223D; --ac:#4D8BFF;
 --cs:dark;
}
/* La racine est toujours « sombre » : iOS 26 teinte la zone de la barre d'état d'après
   elle (voile gris sur fond clair) ; le contenu, lui, suit le thème choisi (--cs). */
html{background:var(--ch);color-scheme:dark}
body{background:var(--ch);color-scheme:var(--cs);color:var(--t1);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--t1);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* ---------- bandeau du haut (toujours foncé) ---------- */
/* En-tête FIXÉ en haut de l'écran (plus « collant ») : iOS 26 prolonge alors sa couleur
   sous la barre d'état au lieu d'y poser un flou gris qui délavait le titre. Le contenu
   est décalé de sa hauteur réelle (--haut, mesurée par caler()). */
.chrome{background:var(--ch);color:var(--cht);padding-top:var(--sat);position:fixed;top:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:8}
main{padding-top:var(--haut,190px)}
/* Trois colonnes : la colonne du milieu est vraiment centrée, quelle que soit la
   largeur du bouton de droite. Le titre descend un peu sous la barre d'état. */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 6px}
header>#bReg{justify-self:start}
header>.maj{justify-self:end}
.rond{width:34px;height:34px;border-radius:50%;background:var(--chs);display:flex;align-items:center;justify-content:center;
 font-size:14px;font-weight:700;color:var(--cht);flex:0 0 34px}
.ht{text-align:center}
.hd{font-size:16px;font-weight:800;letter-spacing:-.3px}
.hj{font-size:12px;color:var(--cht3)}
.maj{display:flex;align-items:center;gap:6px;background:var(--chs);border-radius:17px;height:34px;padding:0 11px;font-size:13px;font-weight:600;color:var(--cht)}
.maj i{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:block}
.maj i.vieux{background:#FBBF24}
.maj i.encours{background:#38BDF8;animation:pouls 1.2s ease-in-out infinite}
@keyframes pouls{50%{opacity:.25}}
/* Les flèches encadrent la ligne des jours : une rangée de moins dans le bandeau. */
.semnav{display:flex;align-items:center;padding:2px 2px 10px}
.semnav>button{width:30px;flex:0 0 30px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--cht3)}
.semnav>button:disabled{opacity:.25;cursor:default}
.semnav svg{width:16px;height:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sem{display:flex;flex:1;min-width:0}
.sj{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:12px}
.sjn{font-size:10px;color:var(--cht3);letter-spacing:.4px}
.sjd{font-size:16px;font-weight:600;width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;color:var(--cht)}
.sj.auj .sjd{box-shadow:inset 0 0 0 1.5px var(--cht3)}
.sj.sel .sjd{background:var(--ac);color:var(--act);font-weight:800;box-shadow:none}
.pts{display:flex;gap:3px;height:6px}
.pt{width:6px;height:6px;border-radius:50%}
.pt.afaire{opacity:.4}
.pt.manque{background:transparent!important;box-shadow:inset 0 0 0 1.5px #F87171}

/* ---------- vues ---------- */
.vue{display:none;padding:18px 16px calc(96px + var(--sab))}
.vue.on{display:block}
h1{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.sousT{font-size:14px;color:var(--t3);margin:3px 0 16px}
.retour{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--t2);background:var(--s1);
 border-radius:16px;padding:6px 12px;margin:-6px 0 14px}
.retour svg{width:15px;height:15px}
h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:26px 0 10px}
h2:first-child{margin-top:0}
.astuce{font-size:13px;color:var(--t3);line-height:1.5;margin:-4px 0 10px}

/* alertes */
.err{background:var(--kobg);color:var(--ko);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:12px}
.att{background:var(--warnbg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.att.ko{background:var(--kobg)}
.atth{font-size:12px;font-weight:700;color:var(--warn)}
.att.ko .atth{color:var(--ko)}
.attx{font-size:14px;color:var(--t1);margin-top:2px;line-height:1.45}
.proch{font-size:13px;color:var(--t3);margin:2px 0 16px}
.proch b{color:var(--t1)}
.proch.dossard{border-left:3px solid #F97316;padding-left:9px}

/* ---------- carte de séance ---------- */
.carte{background:var(--s1);border-radius:20px;padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.carte:active{transform:scale(.99)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:14px;padding:4px 10px 4px 8px;
 background:color-mix(in srgb,var(--fa) 16%,transparent);color:var(--t1)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--fa);display:block}
.pill.sport{gap:6px;padding:4px 10px 4px 7px}
.pill.sport svg{width:17px;height:17px;flex:0 0 17px;color:var(--fa)}
.evi{display:inline-flex;vertical-align:-3px;margin-right:6px}
.evi svg{width:16px;height:16px}
.dhf svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.etat{font-size:12px;font-weight:700;border-radius:14px;padding:4px 10px;display:inline-flex;align-items:center;gap:5px}
.etat svg{width:14px;height:14px}
.etat.ok{background:var(--okbg);color:var(--ok)}
.etat.ko{background:var(--kobg);color:var(--ko)}
.etat.mtr{background:var(--s2);color:var(--t2)}
.ctit{font-size:23px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--t2);font-weight:500}
.cmeta span{display:inline-flex;align-items:center;gap:5px}
.cmeta svg{width:15px;height:15px;color:var(--t3)}
.prof{display:block;width:100%;height:46px;margin-top:14px}
.reel{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rl{font-size:11px;color:var(--t3)}
.rv{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sens{font-size:13px;color:var(--t2);margin-top:10px}
.carte.repos{background:transparent;border:1.5px dashed var(--line);cursor:default}
.carte.repos .ctit{font-size:20px}
.carte.repos p{font-size:14px;color:var(--t2);margin-top:6px;line-height:1.5}
.vide{font-size:15px;color:var(--t3);padding:22px 0;text-align:center}

/* mot du coach */
.mot{border-left:3px solid var(--t1);padding:2px 0 2px 14px;margin:20px 0 6px}
.motd{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:4px}
.mtx{font-size:15px;line-height:1.55;color:var(--t2)}
.mtx b{color:var(--t1);font-weight:700}
/* Page Jour : une hiérarchie nette — séance, forme, consigne, semaine, à régler. */
.mot{border-left:0;background:var(--s1);border-radius:20px;padding:14px 16px;margin:0 0 12px}
.mcons{font-size:17px;font-weight:700;line-height:1.4;color:var(--t1);letter-spacing:-.2px}
.mot .mtx{margin-top:8px;font-size:14px}
.mot > .lien{padding-top:8px}
.matin .fhd{font-size:15px;font-weight:800;color:var(--t2)}
.matin .n3{grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;background:var(--bg);border-radius:14px;padding:2px 0}
.matin .n3 > div{background:none;border-radius:0;padding:9px 12px;border-left:1px solid var(--line)}
.matin .n3 > div:first-child{border-left:0}
.matin .n3v{font-size:19px}
.matin .feus{margin-top:10px}
.matin > .lien{padding-top:6px}
.sem7{display:block;width:100%;text-align:left;background:var(--s1);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.s7h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--t3)}
.s7h > span:first-child{font-size:15px;font-weight:800;color:var(--t1)}
.s7h b{color:var(--t1)}
.sem7 .barre{margin:9px 0 4px}
.s7l{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--t2);margin-top:9px;line-height:1.35}
.s7l b{color:var(--t1)}
.s7l em{font-style:normal;font-size:11px;font-weight:700;color:var(--t3);background:var(--s2);border-radius:8px;padding:1px 6px;margin-left:2px}
.s7p{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.s7c svg{width:15px;height:15px;flex:0 0 15px;color:#F97316}
.aregler{margin-bottom:12px}
.arh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--warnbg);border-radius:16px;padding:11px 14px;font-size:14px;color:var(--t2)}
.aregler.ko .arh{background:var(--kobg)}
.arn{flex:0 0 22px;height:22px;border-radius:11px;background:var(--warn);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.aregler.ko .arn{background:var(--ko)}
.art{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art b{color:var(--t1)}
.arh .chev{color:var(--t3);font-weight:400;font-size:18px}
.aregler .att{margin:8px 0 0}
.etat.prov{color:var(--t3);background:var(--s2);border-radius:10px;padding:2px 8px;font-size:11px}
/* Progrès : tableau de bord */
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tuile{text-align:left;background:var(--s1);border-radius:18px;padding:13px 14px 12px;min-width:0}
.tuile .tl{font-size:13px;font-weight:700;color:var(--t3)}
.tuile .tv{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuile .tdx{font-size:12px;color:var(--t3);margin-top:1px}
.tuile .tdx.ok{color:var(--ok)} .tuile .tdx.warn{color:var(--warn)}
.objs{background:var(--s1);border-radius:18px;padding:2px 14px}
.obj{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.obj:first-child{border-top:0}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;color:var(--t1)}
.ov{font-size:14px;color:var(--t3);white-space:nowrap}
.ov.ok{color:var(--ok)} .ov.warn{color:var(--warn)}
.oh .chev,.ligne.det .chev{color:var(--t4);font-weight:400;font-size:18px;margin-left:2px}
.obj .barre{margin:8px 0 0}
.grp.lignes{margin-bottom:0}
.ligne.det{width:100%;text-align:left}
.motr{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;line-height:1.45;color:var(--t3)}
.motr b{color:var(--t2);font-weight:700}
.motr i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-top:5px;animation:pouls 1.2s ease-in-out infinite}

/* chiffres */
.n3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.n3 > div{background:var(--s1);border-radius:16px;padding:12px 11px;min-width:0}
.n3l{font-size:11px;color:var(--t3);text-transform:lowercase}
.n3l::first-letter{text-transform:uppercase}
.n3v{font-size:22px;font-weight:800;margin:2px 0 1px;letter-spacing:-.6px}
.n3d{font-size:11px;line-height:1.35}

/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:26px;padding:15px;font-size:15px;font-weight:700;
 background:var(--btn);color:var(--btnt);margin-top:12px}
.btn.creux{background:transparent;color:var(--t1);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}

/* messages au coach */
.msg{background:var(--s1);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.msgt{font-size:14px;line-height:1.45}
.msgs{font-size:11px;color:var(--t3);margin-top:4px}

/* ---------- plan ---------- */
.wk{margin-bottom:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.wk.ici{border:2px solid var(--ac)}
.wkhaut{padding:14px 14px 10px}
.wkh2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wkt{font-size:18px;font-weight:800;letter-spacing:-.4px}
.wkb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--s2);color:var(--t2);border-radius:12px;padding:3px 9px}
.wk.ici .wkb{background:var(--ac);color:var(--act)}
.wkhaut .wks{margin:4px 0 0}
.wkhaut .barre{margin:8px 0 0}
.wk .jr{align-items:flex-start;padding:10px 12px 10px 4px;gap:8px;cursor:default}
.wk .jrd{width:44px;flex:0 0 44px;padding-top:6px}
.wk .jrs{flex-direction:row;flex-wrap:wrap;gap:8px}
.wk .jrv{padding:8px 0}
.wk .jrs .ev{flex:1 1 calc(50% - 4px);min-width:calc(50% - 4px);background:var(--s1);border-radius:10px;padding:9px 8px 9px 14px;
 position:relative;overflow:hidden;align-items:flex-start;gap:6px}
.wk .jrs .evb{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0;min-height:0}
.wk .jrs .evn{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px;line-height:1.3}
.wk .jrs .evs{margin-top:2px}
.wk .jrs .ico{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.evb.ech.dossard{background:#F97316}
.wkh{display:flex;align-items:baseline;justify-content:space-between}
.wkn{font-size:19px;font-weight:800;letter-spacing:-.4px}
.wkd{font-size:13px;color:var(--t3)}
.barre{height:6px;border-radius:3px;background:var(--s2);margin:10px 0 6px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--ok);border-radius:3px}
.wks{font-size:13px;color:var(--t2);margin-bottom:8px}
.jr{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.jrd{width:34px;flex:0 0 34px;text-align:center}
.jrn{font-size:10px;color:var(--t3);letter-spacing:.4px}
.jrc{font-size:17px;font-weight:700}
.jr.auj .jrc{color:var(--act);background:var(--ac);border-radius:50%;width:30px;height:30px;line-height:30px;margin:1px auto 0;font-size:15px}
.jrs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mini{display:flex;align-items:center;gap:10px;min-width:0}
.minb{width:4px;align-self:stretch;border-radius:2px;flex:0 0 4px}
.minc{flex:1;min-width:0}
.minn{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mins{font-size:12px;color:var(--t3)}
.mins.ok{color:var(--ok)} .mins.ko{color:var(--ko)}
.ico{width:20px;height:20px;flex:0 0 20px}
.ico.ok{color:var(--ok)} .ico.ko{color:var(--ko)} .ico.af{color:var(--t4)}
.jrv{font-size:14px;color:var(--t4)}

/* ---------- progrès ---------- */
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tu{background:var(--s1);border-radius:16px;padding:13px}
.tul{font-size:12px;color:var(--t3)}
.tuv{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.tud{font-size:11px;color:var(--t3);margin-top:2px}
.tug{font-size:12px;color:var(--ok);margin-top:2px}
.td{background:var(--s1);border-radius:16px;padding:12px 13px 10px;margin-bottom:8px}
.tdh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.tdv{font-size:19px;font-weight:800;letter-spacing:-.4px}
.tdq{font-size:11px;color:var(--t3)}
.crb{display:block;width:100%;height:50px}
.tdl{font-size:11px;color:var(--t3);margin-top:6px}
.ecart{font-size:13px;line-height:1.5;color:var(--warn);margin:2px 0 10px}

/* ---------- onglets ---------- */
nav.tb{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
 -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
 border-top:1px solid var(--line);padding:8px 0 calc(8px + var(--sab));z-index:10}
nav.tb .in{max-width:560px;margin:0 auto;display:flex}
nav.tb button{flex:1;text-align:center;color:var(--t3);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tb button.on{color:var(--ac)}
nav.tb svg{width:22px;height:22px}

/* ---------- détail de séance (plein écran) ---------- */
#det{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#det.on{display:block}
.dw{max-width:560px;margin:0 auto;padding-bottom:calc(30px + var(--sab))}
.dh{padding:calc(var(--sat) + 10px) 16px 22px;color:#fff}
.dhb{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.dhb button{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center}
.dhb svg{width:20px;height:20px}
.dhj{font-size:13px;font-weight:700}
.dhf{font-size:13px;font-weight:700;opacity:.85;margin-bottom:4px}

 --bg:#0A1022;--s1:#131B30;--s2:#1D2742;--line:#262E38;--t1:#FFFFFF;--t2:#B4BCC6;--t3:#8A939E;--t4:#4B5563;
